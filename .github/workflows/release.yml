name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crates-io-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TOOLCHAIN: '1.99.1'
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  verify:
    name: Verify tagged source and release package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.package.outputs.version }}
      prerelease: ${{ steps.package.outputs.prerelease }}
      subjects: ${{ steps.subjects.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require matching version tag on main history
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$REF_TYPE" = tag
          python dev/release.py metadata --tag "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
          test -z "$(git status --porcelain)"
      - name: Require successful CI for the exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          passed=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --branch main --event push --status success --json headSha --jq 'length > 0')
          if [ "$passed" != true ]; then
            echo "The tagged commit needs a successful main CI run before publication."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RELEASE_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            site -> target
      - name: Test library and documentation tooling
        run: |
          cargo generate-lockfile
          cargo fmt --check
          cargo fmt --manifest-path fuzz/Cargo.toml --check
          cargo fmt --manifest-path site/Cargo.toml --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo clippy --all-targets --no-default-features --locked -- -D warnings
          cargo clippy --manifest-path site/Cargo.toml --locked -- -D warnings
          cargo test --all-features --locked
          for feature in e g ex gx; do
            cargo test --no-default-features --features "$feature" --locked
            cargo test --no-default-features --features "$feature,envelope" --locked
          done
          cargo test --no-default-features --locked
          cargo test --no-default-features --features envelope --locked
          python dev/check-features.py
          cargo run --example wrap_key --no-default-features --features gx,envelope --locked
          cargo run --example rotate_key --no-default-features --features gx,envelope --locked
          cargo run --example detached_tag --no-default-features --features g --locked
          cargo bench --all-features --locked -- --test
          python -B -m unittest discover -s dev/tests -v
          python dev/install-actionlint.py "$RUNNER_TEMP/actionlint"
          "$RUNNER_TEMP/actionlint"
      - name: Verify minimum Rust version
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          cargo +1.88.0 test --all-features --locked
      - name: Build and validate website
        run: |
          cargo run --manifest-path site/Cargo.toml --locked -- target/pages --base /arx-kw/
          cargo clean --doc
          cargo doc --all-features --no-deps --locked
          mkdir -p target/pages/doc
          cp -R target/doc/. target/pages/doc/
          python dev/check-site.py target/pages --base /arx-kw/
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Audit resolved library and website dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit
          cargo audit --file site/Cargo.lock
      - name: Verify publish package without uploading
        run: |
          rm -f target/package/arx-kw-*.crate
          cargo publish --dry-run --locked
          cargo package --locked
      - name: Record verified archive and release notes
        id: package
        run: python dev/release.py prepare --tag "$RELEASE_TAG"
      - name: Export verified crate digest for isolated provenance generation
        id: subjects
        working-directory: target/release-artifacts
        run: echo "hashes=$(base64 -w0 SHA256SUMS)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: target/release-artifacts/
          if-no-files-found: error
          retention-days: 14

  provenance:
    name: Generate isolated SLSA provenance
    needs: verify
    permissions:
      actions: read
      # Required by the reusable workflow's declared upload job, even when skipped.
      contents: write
      id-token: write
    # The verifier requires the generator's full semantic-version tag.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.verify.outputs.subjects }}
      provenance-name: arx-kw.intoto.jsonl
      upload-assets: false

  publish:
    name: Publish verified crate
    needs: [verify, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RELEASE_TOOLCHAIN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: ${{ runner.temp }}/arx-kw-release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: ${{ runner.temp }}/arx-kw-provenance
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          cache: false
      - name: Verify signed provenance before obtaining registry credentials
        env:
          GOBIN: ${{ runner.temp }}/slsa-tools
        run: |
          go install github.com/slsa-framework/slsa-verifier/v2/cli/slsa-verifier@v2.7.1
          "$GOBIN/slsa-verifier" verify-artifact \
            "$RUNNER_TEMP/arx-kw-release/arx-kw-${{ needs.verify.outputs.version }}.crate" \
            --provenance-path "$RUNNER_TEMP/arx-kw-provenance/arx-kw.intoto.jsonl" \
            --source-uri "github.com/$GITHUB_REPOSITORY" \
            --source-tag "$RELEASE_TAG" \
            --builder-id 'https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0'
      - name: Reproduce the verified package before obtaining credentials
        run: |
          cp "$RUNNER_TEMP/arx-kw-release/Cargo.lock" Cargo.lock
          (cd "$RUNNER_TEMP/arx-kw-release" && sha256sum --check SHA256SUMS)
          cargo package --locked
          cmp "target/package/arx-kw-${{ needs.verify.outputs.version }}.crate" "$RUNNER_TEMP/arx-kw-release/arx-kw-${{ needs.verify.outputs.version }}.crate"
      - name: Check for an identical immutable registry version
        id: registry
        run: python dev/release.py registry --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/arx-kw-release"
      - name: Authenticate with crates.io trusted publishing
        if: steps.registry.outputs.published != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish
        if: steps.registry.outputs.published != 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    name: Create GitHub release after registry publication
    needs: [verify, provenance, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: ${{ runner.temp }}/arx-kw-release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: ${{ runner.temp }}/arx-kw-release
      - name: Create release and attach verified archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          cd "$RUNNER_TEMP/arx-kw-release"
          sha256sum --check SHA256SUMS
          extra=()
          if [ "$PRERELEASE" = true ]; then extra+=(--prerelease); fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./*.crate SHA256SUMS arx-kw.intoto.jsonl --clobber
          else
            gh release create "$RELEASE_TAG" ./*.crate SHA256SUMS arx-kw.intoto.jsonl --verify-tag \
              --title "ARX-KW $RELEASE_TAG" --notes-file release-notes.md "${extra[@]}"
          fi
