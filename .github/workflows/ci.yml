name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  test:
    name: Test / ${{ matrix.os }} / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: ['1.88.0', stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.toolchain }}
      - run: cargo generate-lockfile
      - run: cargo test --all-features --locked
      - name: Run examples on each platform and toolchain
        run: |
          cargo run --example wrap_key --all-features --locked
          cargo run --example rotate_key --all-features --locked
          cargo run --example detached_tag --all-features --locked

  features:
    name: Feature configurations and benchmark smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo generate-lockfile
      - name: Test each variant independently
        run: |
          for feature in e g ex gx; do
            cargo test --no-default-features --features "$feature" --locked
            cargo test --no-default-features --features "$feature,envelope" --locked
          done
          cargo test --no-default-features --locked
          cargo test --no-default-features --features envelope --locked
          python dev/check-features.py
          cargo run --example wrap_key --no-default-features --features gx,envelope --locked
          cargo run --example rotate_key --no-default-features --features gx,envelope --locked
          cargo run --example detached_tag --no-default-features --features g --locked
      - run: cargo bench --all-features --locked -- --test

  lint:
    name: Formatting, Clippy, workflows, release checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            site -> target
      - run: cargo generate-lockfile
      - run: cargo fmt --check
      - run: cargo fmt --manifest-path site/Cargo.toml --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo clippy --all-targets --no-default-features --locked -- -D warnings
      - run: cargo clippy --manifest-path site/Cargo.toml --locked -- -D warnings
      - name: Validate workflow definitions and release guardrails
        run: |
          python dev/install-actionlint.py "$RUNNER_TEMP/actionlint"
          "$RUNNER_TEMP/actionlint"
          python -B -m unittest discover -s dev/tests -v

  website:
    name: Build and check documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            site -> target
      - run: cargo generate-lockfile
      - run: cargo run --manifest-path site/Cargo.toml --locked -- target/pages --base /arx-kw/
      - run: cargo clean --doc
      - run: cargo doc --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Check complete static artifact
        run: |
          mkdir -p target/pages/doc
          cp -R target/doc/. target/pages/doc/
          python dev/check-site.py target/pages --base /arx-kw/
