[package]
name = "arx-kw"
version = "0.4.0"
authors = ["Thor McAvenia <mcaveniathor@gmail.com>"]
edition = "2018"
rust-version = "1.88"
license = "MIT"
keywords = ["cryptography", "key", "encryption", "keywrap", "arx-kw"]
categories = ["cryptography", "encoding", "algorithms", "authentication"]
description = "An implementation of the ARX-KW-8-2-4 Key Wrap constructions"
repository = "https://github.com/mcaveniathor/arx-kw"
readme = "README.md"
documentation = "https://docs.rs/arx-kw"

[features]
e = []
g = []
gx = []
ex = []
default = ["e", "g", "gx", "ex"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chacha20 = { version = "0.10.2", features = ["zeroize", "xchacha"] }
zeroize = { version = "1.9.1", features = ["derive"] }
# Enable zeroization for the context KDF's HMAC state as well as SHA-256.
hmac = { version = "0.13.0", features = ["zeroize"] }
sha2 = { version = "0.11.1", features = ["zeroize"] }
arrayref = "0.3.9"
thiserror = "2.0.21"
subtle = "2.6.1"

[dev-dependencies]
hkdf = "0.13.0"
# Independent compatibility oracles; never linked into the published library.
chacha = "0.4.0"
siphasher = "1.0.4"
hex = "0.4.3"
anyhow = "1.0.104"
criterion = "0.8.2"


# Benches run with Criterion

[[bench]]
name = "e"
harness = false
required-features = ["e"]

[[bench]]
name = "ex"
harness = false
required-features = ["ex"]

[[bench]]
name = "g"
harness = false
required-features = ["g"]

[[bench]]
name = "gx"
harness = false
required-features = ["gx"]
